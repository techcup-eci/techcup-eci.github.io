<svg width="100%" viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Diagrama de contenedores TechCup – API Gateway e Identity Service</title>
<desc>Diagrama C4 nivel contenedores mostrando el Frontend, API Gateway, Identity Service y los microservicios restantes con sus dependencias.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: Arial, sans-serif; fill: #1a1a1a; }
    .th  { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .ts  { font-size: 12px; font-weight: 400; fill: #555555; }
    .arr { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    /* Frontend – teal */
    .fe-bg   { fill: #e1f5ee; stroke: #0f6e56; }
    .fe-text { fill: #085041; }
    .fe-sub  { fill: #0f6e56; }
    /* Gateway – purple */
    .gw-bg   { fill: #eeedfe; stroke: #534ab7; }
    .gw-sub-bg { fill: #afa9ec; stroke: #534ab7; }
    .gw-text { fill: #26215c; }
    .gw-sub  { fill: #3c3489; }
    /* Identity – blue */
    .id-bg   { fill: #e6f1fb; stroke: #185fa5; }
    .id-sub-bg { fill: #85b7eb; stroke: #185fa5; }
    .id-text { fill: #042c53; }
    .id-sub  { fill: #0c447c; }
    /* Other MS – coral */
    .ms-bg   { fill: #faece7; stroke: #993c1d; }
    .ms-text { fill: #4a1b0c; }
    .ms-sub  { fill: #712b13; }
    /* DB – gray */
    .db-bg   { fill: #f1efe8; stroke: #5f5e5a; }
    .db-text { fill: #2c2c2a; }
    .db-sub  { fill: #444441; }
    /* border */
    .border  { fill: none; stroke: #c0bdb5; stroke-width: 0.8; }
    /* webclient arrow */
    .wc-arr  { stroke: #ba7517; stroke-width: 1.2; stroke-dasharray: 5 3; fill: none; }
    .wc-text { fill: #633806; }
    /* container dashes */
    .dash { stroke-dasharray: 6 3; }
  </style>
</defs>

<!-- ═══ FRONTEND ═══ -->
<rect x="230" y="20" width="220" height="52" rx="8" stroke-width="0.5" class="fe-bg"/>
<text class="th fe-text" x="340" y="41" text-anchor="middle" dominant-baseline="central">Frontend</text>
<text class="ts fe-sub" x="340" y="59" text-anchor="middle" dominant-baseline="central">React + TypeScript · Netlify</text>

<!-- flecha frontend → gateway -->
<line x1="340" y1="72" x2="340" y2="108" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="356" y="93" dominant-baseline="central">HTTPS / REST</text>

<!-- ═══ API GATEWAY contenedor ═══ -->
<rect x="30" y="108" width="620" height="182" rx="12" stroke-width="0.5" class="gw-bg dash"/>
<text class="th gw-text" x="46" y="130" dominant-baseline="central">API Gateway (Orquestador) · Puerto 8080</text>
<text class="ts gw-sub" x="46" y="148" dominant-baseline="central">Spring Cloud Gateway · Spring Boot · Reactivo</text>

<!-- CorsConfig -->
<rect x="50" y="158" width="130" height="50" rx="6" stroke-width="0.5" class="gw-sub-bg"/>
<text class="th gw-text" x="115" y="177" text-anchor="middle" dominant-baseline="central">CorsConfig</text>
<text class="ts gw-sub" x="115" y="193" text-anchor="middle" dominant-baseline="central">CORS centralizado</text>

<!-- AuthFilter -->
<rect x="205" y="158" width="140" height="50" rx="6" stroke-width="0.5" class="gw-sub-bg"/>
<text class="th gw-text" x="275" y="177" text-anchor="middle" dominant-baseline="central">AuthFilter</text>
<text class="ts gw-sub" x="275" y="193" text-anchor="middle" dominant-baseline="central">JWT · X-User-* headers</text>

<!-- JwtUtil GW -->
<rect x="370" y="158" width="130" height="50" rx="6" stroke-width="0.5" class="gw-sub-bg"/>
<text class="th gw-text" x="435" y="177" text-anchor="middle" dominant-baseline="central">JwtUtil</text>
<text class="ts gw-sub" x="435" y="193" text-anchor="middle" dominant-baseline="central">Validación básica JWT</text>

<!-- ErrorHandler -->
<rect x="520" y="158" width="112" height="50" rx="6" stroke-width="0.5" class="gw-sub-bg"/>
<text class="th gw-text" x="576" y="177" text-anchor="middle" dominant-baseline="central">ErrorHandler</text>
<text class="ts gw-sub" x="576" y="193" text-anchor="middle" dominant-baseline="central">Errores globales</text>

<!-- flechas internas gateway -->
<line x1="180" y1="183" x2="205" y2="183" stroke="#534ab7" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>
<line x1="345" y1="183" x2="370" y2="183" stroke="#534ab7" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>
<line x1="500" y1="183" x2="520" y2="183" stroke="#534ab7" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>

<!-- rutas texto -->
<text class="ts" x="340" y="234" text-anchor="middle" dominant-baseline="central">/api/identity/** · /api/users/** · /api/teams/** · /api/tournaments/** · /api/competition/**</text>
<text class="ts" x="340" y="250" text-anchor="middle" dominant-baseline="central">Header X-Internal-Secret + X-User-Id / X-User-Role / X-User-Email en cada proxy</text>
<text class="ts" x="340" y="266" text-anchor="middle" dominant-baseline="central">Swagger UI centralizado · Actuator /health</text>

<!-- ═══ IDENTITY SERVICE contenedor ═══ -->
<rect x="30" y="322" width="378" height="212" rx="12" stroke-width="0.5" class="id-bg dash"/>
<text class="th id-text" x="46" y="344" dominant-baseline="central">Identity Service · Puerto 8081</text>
<text class="ts id-sub" x="46" y="362" dominant-baseline="central">Spring Boot · Spring Security · PostgreSQL</text>

<!-- IdentityController -->
<rect x="50" y="372" width="148" height="56" rx="6" stroke-width="0.5" class="id-sub-bg"/>
<text class="th id-text" x="124" y="390" text-anchor="middle" dominant-baseline="central">IdentityController</text>
<text class="ts id-sub" x="124" y="407" text-anchor="middle" dominant-baseline="central">login · register · refresh</text>
<text class="ts id-sub" x="124" y="421" text-anchor="middle" dominant-baseline="central">logout · validate · /me</text>

<!-- AuthService -->
<rect x="220" y="372" width="136" height="56" rx="6" stroke-width="0.5" class="id-sub-bg"/>
<text class="th id-text" x="288" y="390" text-anchor="middle" dominant-baseline="central">AuthService</text>
<text class="ts id-sub" x="288" y="407" text-anchor="middle" dominant-baseline="central">login · register</text>
<text class="ts id-sub" x="288" y="421" text-anchor="middle" dominant-baseline="central">refresh · logout</text>

<!-- JwtUtil identity -->
<rect x="50" y="444" width="136" height="56" rx="6" stroke-width="0.5" class="id-sub-bg"/>
<text class="th id-text" x="118" y="462" text-anchor="middle" dominant-baseline="central">JwtUtil</text>
<text class="ts id-sub" x="118" y="479" text-anchor="middle" dominant-baseline="central">Genera access token</text>
<text class="ts id-sub" x="118" y="493" text-anchor="middle" dominant-baseline="central">Refresh SHA-256</text>

<!-- AuditService -->
<rect x="204" y="444" width="152" height="56" rx="6" stroke-width="0.5" class="id-sub-bg"/>
<text class="th id-text" x="280" y="462" text-anchor="middle" dominant-baseline="central">AuditService</text>
<text class="ts id-sub" x="280" y="479" text-anchor="middle" dominant-baseline="central">LOGIN · REGISTER</text>
<text class="ts id-sub" x="280" y="493" text-anchor="middle" dominant-baseline="central">LOGOUT · STATUS_CHANGE</text>

<!-- PostgreSQL identity -->
<rect x="30" y="558" width="192" height="44" rx="8" stroke-width="0.5" class="db-bg"/>
<text class="th db-text" x="126" y="574" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
<text class="ts db-sub" x="126" y="590" text-anchor="middle" dominant-baseline="central">users · audit_logs · refresh_tokens</text>

<!-- UserServiceClient -->
<rect x="238" y="558" width="160" height="44" rx="6" stroke-width="0.5" class="id-sub-bg"/>
<text class="th id-text" x="318" y="574" text-anchor="middle" dominant-baseline="central">UserServiceClient</text>
<text class="ts id-sub" x="318" y="590" text-anchor="middle" dominant-baseline="central">WebClient → users-ms</text>

<!-- flechas internas identity -->
<line x1="198" y1="400" x2="220" y2="400" stroke="#185fa5" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>
<line x1="118" y1="428" x2="118" y2="444" stroke="#185fa5" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>
<line x1="288" y1="428" x2="280" y2="444" stroke="#185fa5" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>
<line x1="118" y1="500" x2="118" y2="558" stroke="#185fa5" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>
<line x1="280" y1="500" x2="280" y2="558" stroke="#185fa5" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>

<!-- ═══ Gateway → Identity ═══ -->
<path d="M219 290 L219 322" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="140" y="307" dominant-baseline="central">HTTP proxy</text>
<text class="ts" x="140" y="320" dominant-baseline="central">X-Internal-Secret</text>

<!-- ═══ OTROS MICROSERVICIOS ═══ -->

<!-- Users MS -->
<rect x="432" y="322" width="220" height="52" rx="8" stroke-width="0.5" class="ms-bg"/>
<text class="th ms-text" x="542" y="341" text-anchor="middle" dominant-baseline="central">Users &amp; Players MS</text>
<text class="ts ms-sub" x="542" y="358" text-anchor="middle" dominant-baseline="central">Puerto 8082 · PostgreSQL + MongoDB</text>

<!-- Teams MS -->
<rect x="432" y="396" width="220" height="52" rx="8" stroke-width="0.5" class="ms-bg"/>
<text class="th ms-text" x="542" y="415" text-anchor="middle" dominant-baseline="central">Teams MS</text>
<text class="ts ms-sub" x="542" y="432" text-anchor="middle" dominant-baseline="central">Puerto 8083 · gestión de equipos</text>

<!-- Tournaments MS -->
<rect x="432" y="470" width="220" height="52" rx="8" stroke-width="0.5" class="ms-bg"/>
<text class="th ms-text" x="542" y="489" text-anchor="middle" dominant-baseline="central">Tournaments MS</text>
<text class="ts ms-sub" x="542" y="506" text-anchor="middle" dominant-baseline="central">Puerto 8084 · inscripciones · pagos</text>

<!-- Competition MS -->
<rect x="432" y="544" width="220" height="52" rx="8" stroke-width="0.5" class="ms-bg"/>
<text class="th ms-text" x="542" y="563" text-anchor="middle" dominant-baseline="central">Competition MS</text>
<text class="ts ms-sub" x="542" y="580" text-anchor="middle" dominant-baseline="central">Puerto 8085 · partidos · resultados</text>

<!-- Gateway → Users MS -->
<path d="M462 290 L462 322" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Gateway → Teams MS -->
<path d="M500 290 L500 310 L542 310 L542 396" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Gateway → Tournaments MS -->
<path d="M540 290 L540 300 L620 300 L620 496 L652 496 M620 496 L542 496" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Gateway → Competition MS -->
<path d="M560 290 L560 295 L640 295 L640 570 L652 570 M640 570 L542 570" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- Identity → Users MS (WebClient) -->
<path d="M398 580 C430 580 430 348 432 348" fill="none" stroke="#ba7517" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text class="ts wc-text" x="410" y="455" dominant-baseline="central">WebClient</text>
<text class="ts wc-text" x="410" y="468" dominant-baseline="central">(register / role sync)</text>

<!-- ═══ LEYENDA ═══ -->
<rect x="30" y="626" width="620" height="80" rx="8" class="border"/>
<text class="th" x="46" y="646" dominant-baseline="central">Leyenda</text>

<rect x="46" y="658" width="14" height="14" rx="3" class="fe-bg"/>
<text class="ts" x="66" y="665" dominant-baseline="central">Frontend</text>

<rect x="138" y="658" width="14" height="14" rx="3" class="gw-bg"/>
<text class="ts" x="158" y="665" dominant-baseline="central">API Gateway</text>

<rect x="256" y="658" width="14" height="14" rx="3" class="id-bg"/>
<text class="ts" x="276" y="665" dominant-baseline="central">Identity Service</text>

<rect x="390" y="658" width="14" height="14" rx="3" class="ms-bg"/>
<text class="ts" x="410" y="665" dominant-baseline="central">Otros microservicios</text>

<rect x="546" y="658" width="14" height="14" rx="3" class="db-bg"/>
<text class="ts" x="566" y="665" dominant-baseline="central">Base de datos</text>

<line x1="46" y1="694" x2="76" y2="694" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="82" y="694" dominant-baseline="central">HTTP / proxy</text>

<line x1="200" y1="694" x2="230" y2="694" stroke="#ba7517" stroke-width="1.2" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow)"/>
<text class="ts wc-text" x="236" y="694" dominant-baseline="central">WebClient (interno)</text>

<line x1="390" y1="694" x2="420" y2="694" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
<text class="ts" x="426" y="694" dominant-baseline="central">Límite de contenedor</text>

<!-- ═══ NOTA SEGURIDAD ═══ -->
<rect x="30" y="722" width="620" height="44" rx="8" class="border"/>
<text class="ts" x="340" y="737" text-anchor="middle" dominant-baseline="central">Flujo de seguridad: Identity genera JWT → Gateway valida firma (básico) e inyecta X-User-Id / X-User-Role / X-User-Email</text>
<text class="ts" x="340" y="753" text-anchor="middle" dominant-baseline="central">Los microservicios reciben X-Internal-Secret para verificar que la solicitud viene del gateway.</text>

</svg>
